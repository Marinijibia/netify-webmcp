# ==============================================================================
# RENDER BLUEPRINT SPECIFICATION (1-CLICK DEPLOY)
# ==============================================================================
services:
  # Netify NestJS API Service
  - type: web
    name: netify-api
    env: node
    plan: starter
    rootDir: .
    dockerfilePath: apps/api/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_EXPIRATION
        value: 7d
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: netify-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: netify-redis
          property: connectionString

  # Netify Next.js Web App Service
  - type: web
    name: netify-web
    env: node
    plan: starter
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: netify-api
          property: host
          valueTemplate: "https://${host}/api/v1"

databases:
  - name: netify-db
    plan: starter
    postgresMajorVersion: 16
    ipAllowList: []

  - name: netify-redis
    plan: starter
    ipAllowList: []
