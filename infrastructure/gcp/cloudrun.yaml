apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: netify-api
  labels:
    cloud.googleapis.com/location: europe-west1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/cloudsql-instances: netify-saas:europe-west1:netify-postgres-db
    spec:
      containers:
        - image: gcr.io/netify-saas/netify-api:latest
          resources:
            limits:
              memory: 1Gi
              cpu: '1000m'
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: AI_PROVIDER
              value: "openai"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netify-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: netify-secrets
                  key: jwt-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: netify-secrets
                  key: openai-api-key
