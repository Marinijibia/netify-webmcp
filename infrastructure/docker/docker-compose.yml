version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: netify-postgres
    restart: always
    environment:
      POSTGRES_USER: netify_user
      POSTGRES_PASSWORD: netify_password
      POSTGRES_DB: netify_db
    ports:
      - "5432:5432"
    volumes:
      - netify_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netify_user -d netify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netify-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - netify_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  netify_pgdata:
  netify_redisdata:
